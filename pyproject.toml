[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "blockscramble"
version = "1.0.0"
description = "Official PyTorch implementation of 'Block-wise Scrambled Image Recognition Using Adaptation Network' (AAAI-20 Workshop on AIoT)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Koki Madono" }]
keywords = [
    "image scrambling",
    "privacy-preserving machine learning",
    "learnable image encryption",
    "adaptation network",
    "perceptual information hiding",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=1.13",
    "torchvision>=0.14",
    "numpy",
    "pillow",
]

[project.optional-dependencies]
examples = ["matplotlib", "scikit-image"]
test = ["pytest"]

[project.urls]
Homepage = "https://madonokouki.github.io/projects/blockscramble/"
Repository = "https://github.com/MADONOKOUKI/Block-wise-Scrambled-Image-Recognition"
Paper = "https://arxiv.org/abs/2001.07761"

[tool.setuptools]
packages = ["blockscramble"]

[tool.setuptools.package-data]
blockscramble = ["resources/*.npz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
